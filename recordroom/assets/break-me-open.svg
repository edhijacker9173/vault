<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Break Me Open cover art</title>
  <desc id="desc">Abstract record cover with a cracked luminous center and dark red, teal, and amber light.</desc>
  <defs>
    <radialGradient id="core" cx="52%" cy="46%" r="58%">
